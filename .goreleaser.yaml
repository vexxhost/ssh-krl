version: 2
builds:
  - main: ./cmd/ssh-krl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, contrib/**/*]
checksum:
  name_template: checksums.txt
changelog:
  use: github-native
