apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-krl
  labels:
    app.kubernetes.io/name: ssh-krl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ssh-krl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssh-krl
    spec:
      serviceAccountName: ssh-krl
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ssh-krl
          image: ghcr.io/vexxhost/ssh-krl:latest
          args:
            - -auth-method=kubernetes
            - -auth-role=ssh-krl
            - -log-format=json
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc:8200
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
